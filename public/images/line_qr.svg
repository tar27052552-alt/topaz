<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06c755"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect x="0" y="0" width="250" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Top Left Finder Pattern -->
  <rect x="25" y="25" width="50" height="50" rx="8" fill="none" stroke="#06c755" stroke-width="8"/>
  <rect x="37" y="37" width="26" height="26" rx="4" fill="#06c755"/>
  
  <!-- Top Right Finder Pattern -->
  <rect x="175" y="25" width="50" height="50" rx="8" fill="none" stroke="#06c755" stroke-width="8"/>
  <rect x="187" y="37" width="26" height="26" rx="4" fill="#06c755"/>
  
  <!-- Bottom Left Finder Pattern -->
  <rect x="25" y="175" width="50" height="50" rx="8" fill="none" stroke="#06c755" stroke-width="8"/>
  <rect x="37" y="187" width="26" height="26" rx="4" fill="#06c755"/>
  
  <!-- QR Data Dots Simulation -->
  <g fill="#1e293b">
    <rect x="90" y="25" width="10" height="10" rx="2"/>
    <rect x="110" y="25" width="10" height="20" rx="2"/>
    <rect x="130" y="25" width="10" height="10" rx="2"/>
    <rect x="150" y="25" width="10" height="10" rx="2"/>
    
    <rect x="90" y="45" width="10" height="10" rx="2"/>
    <rect x="130" y="45" width="20" height="10" rx="2"/>
    
    <rect x="90" y="65" width="20" height="10" rx="2"/>
    <rect x="120" y="65" width="10" height="10" rx="2"/>
    <rect x="140" y="65" width="20" height="10" rx="2"/>
    
    <!-- Middle Area -->
    <rect x="25" y="90" width="10" height="20" rx="2"/>
    <rect x="45" y="90" width="20" height="10" rx="2"/>
    <rect x="75" y="90" width="10" height="10" rx="2"/>
    <rect x="165" y="90" width="20" height="10" rx="2"/>
    <rect x="195" y="90" width="10" height="20" rx="2"/>
    <rect x="215" y="90" width="10" height="10" rx="2"/>
    
    <rect x="25" y="120" width="20" height="10" rx="2"/>
    <rect x="55" y="120" width="10" height="20" rx="2"/>
    <rect x="185" y="120" width="10" height="10" rx="2"/>
    <rect x="205" y="120" width="20" height="10" rx="2"/>
    
    <rect x="25" y="150" width="10" height="10" rx="2"/>
    <rect x="45" y="150" width="20" height="10" rx="2"/>
    <rect x="75" y="150" width="10" height="10" rx="2"/>
    <rect x="165" y="150" width="10" height="10" rx="2"/>
    <rect x="185" y="150" width="20" height="10" rx="2"/>
    <rect x="215" y="150" width="10" height="10" rx="2"/>
    
    <!-- Bottom Area -->
    <rect x="90" y="175" width="20" height="10" rx="2"/>
    <rect x="120" y="175" width="10" height="20" rx="2"/>
    <rect x="140" y="175" width="20" height="10" rx="2"/>
    <rect x="175" y="175" width="10" height="10" rx="2"/>
    <rect x="195" y="175" width="20" height="10" rx="2"/>
    
