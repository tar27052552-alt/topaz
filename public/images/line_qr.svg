    <rect x="110" y="195" width="20" height="10" rx="2"/>
    <rect x="140" y="205" width="10" height="10" rx="2"/>
    <rect x="165" y="205" width="20" height="10" rx="2"/>
    <rect x="205" y="205" width="20" height="20" rx="2"/>
  </g>
  
  <!-- Center LINE Logo Badge -->
